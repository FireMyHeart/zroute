  <script>
(function () {
  var btn = document.getElementById("top-link");
  if (!btn) return;
  function scrollTopY() {
    return window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
  }
  function syncTopLink() {
    // Show only after roughly one full viewport of scroll (content below the fold).
    var threshold = Math.max(window.innerHeight, 500);
    btn.classList.toggle("is-visible", scrollTopY() >= threshold);
  }
  function goTop(e) {
    if (e) e.preventDefault();
    if (window.location.hash) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
    // Absolute top: body padding-top (80px) keeps content below the fixed header.
    window.scrollTo({ top: 0, left: 0, behavior: "smooth" });
    // Fallback if smooth scroll is interrupted / hash leftovers.
    setTimeout(function () {
      if (scrollTopY() > 0) window.scrollTo(0, 0);
      syncTopLink();
    }, 400);
  }
  btn.addEventListener("click", goTop);
  window.addEventListener("scroll", syncTopLink, { passive: true });
  window.addEventListener("resize", syncTopLink);
  // Old #top hash scrolled content under the header and left the button visible.
  if (window.location.hash === "#top") {
    history.replaceState(null, "", window.location.pathname + window.location.search);
    window.scrollTo(0, 0);
  }
  syncTopLink();
})();
  </script>

  <script>
const DATA = {"ru": {"v1": {"full": [{"title": "ВВЕДЕНИЕ", "paras": ["Настоящее соглашение закрепляет правила взаимодействия альянсов и игроков сервера 98.", "Цель соглашения — сохранить порядок, доверие, стабильность сервера и готовность к межсерверным событиям.", "Соглашение вступает в силу после его подтверждения лидерами альянсов топ-5."], "status": "same"}, {"title": "01. ОБЩИЕ ПРИНЦИПЫ", "paras": ["Все участники соглашения обязуются действовать добросовестно, не провоцировать внутренние конфликты и решать спорные вопросы через прямой диалог лидеров.", "Ни один альянс, лидер или представитель не имеет права говорить от имени всех участников соглашения без прямого согласия всех сторон.", "Любые правила, затрагивающие интересы конкретного альянса, не могут быть приняты без согласия этого альянса."], "status": "same"}, {"title": "02. NAP-10 / ПАКТ О НЕНАПАДЕНИИ ТОП-10", "paras": ["NAP-10 означает Non-Attack Pact — пакт о ненападении между альянсами, входящими в топ-10 общего рейтинга сервера.", "NAP-10 не является союзом, единым альянсом или органом управления сервером. Участие в NAP-10 означает только обязанность соблюдать правила ненападения и иные условия настоящего соглашения.", "В NAP-10 входят альянсы, занимающие места с 1 по 10 в общем рейтинге альянсов.", "Если альянс входит в топ-10, он обязан соблюдать правила NAP-10.", "Если новый альянс поднимается в топ-10, он получает защиту NAP-10 только после принятия условий настоящего соглашения.", "Если альянс временно выпадает из топ-10, его статус может быть отдельно обсужден лидерами альянсов топ-5."], "status": "same"}, {"title": "03. ЗАПРЕТ НА АТАКИ", "paras": ["Любые атаки между альянсами, находящимися под действием NAP-10, запрещены.", "Запрещены атаки на игроков, базы, войска, ресурсы и иные игровые объекты альянсов, находящихся под действием NAP-10.", "Атаки на плитки запрещены на всем сервере 98 для всех игроков и альянсов без исключений, независимо от места альянса в рейтинге и участия в NAP-10.", "Любая атака на плитку считается нарушением общих правил сервера.", "Любая атака без предварительного согласования между альянсами, находящимися под действием NAP-10, считается нарушением настоящего соглашения."], "status": "same"}, {"title": "04. ЗАПРЕТ ПЕРЕМАНИВАНИЯ ИГРОКОВ", "paras": ["Запрет на переманивание игроков действует только между альянсами топ-3 общего рейтинга сервера.", "Переманивание игроков из альянсов топ-3 строго запрещено.", "Переход игрока из одного альянса топ-3 в другой возможен только по личной инициативе самого игрока.", "Запрещены давление, уговоры, обещания наград или любые иные действия, направленные на ослабление другого альянса топ-3.", "Если игрок сам просит о переходе, принимающий альянс должен быть готов подтвердить, что инициатива исходила от самого игрока.", "На альянсы ниже топ-3 данный запрет не распространяется, если иное не будет отдельно согласовано всеми лидерами топ-3."], "status": "same"}, {"title": "05. ОБЩИЙ ЧЕРНЫЙ СПИСОК", "paras": ["Если игрок ведет себя токсично, оскорбляет участников, провоцирует конфликты или нарушает правила альянса, он может быть исключен.", "По просьбе одного из альянсов такой игрок может быть внесен в общий черный список.", "Перед внесением игрока в черный список любой альянс вправе запросить доказательства нарушений.", "Если игрок из черного списка был принят в альянс по ошибке, самостоятельные атаки на него запрещены. Альянс, заметивший такую ситуацию, обязан уведомить лидера альянса, принявшего игрока.", "На исключение такого игрока дается 48 часов с момента отправки уведомления лидеру. Если уведомление прочитано и проигнорировано либо за 48 часов решение не принято, разрешается атака только на базу конкретного игрока.", "Атаки на плитки запрещены при любых обстоятельствах, даже в отношении игроков из черного списка, нарушителей или альянсов, не входящих в NAP-10."], "status": "same"}, {"title": "06. СМЕНА ЛИДЕРА АЛЬЯНСА", "paras": ["Смена лидера альянса не отменяет ранее принятые договоренности.", "Все соглашения, подтвержденные прошлым лидером, продолжают действовать в полном объеме.", "Новый лидер принимает на себя ответственность за соблюдение настоящего соглашения."], "status": "same"}, {"title": "07. ГРУЗОВИКИ, КОНТЕЙНЕРЫ И СПОРНЫЕ ОБЪЕКТЫ", "paras": ["Грузовики, контейнеры и аналогичные спорные игровые объекты разрешены для атаки между игроками и альянсами.", "Эти объекты считаются свободной игровой активностью и не относятся к запрещенным.", "Исключение: после официального объявления межсерверной битвы и открытия межсерверных грабежей атаки на грузовики, контейнеры и аналогичные объекты между альянсами сервера 98 запрещены.", "Запрет атак на плитки действует всегда, на всем сервере и не зависит от данного пункта."], "status": "same"}, {"title": "08. НАРУШЕНИЕ СОГЛАШЕНИЯ", "paras": ["Если игрок альянса, находящегося под действием NAP-10, нарушил правила, его альянс обязан разобраться в ситуации, дать объяснение пострадавшей стороне, компенсировать ущерб при подтверждении нарушения, принять меры к нарушителю и не допустить повторения ситуации.", "Если альянс покрывает нарушителя или отказывается решать проблему, вопрос выносится на совместное обсуждение лидеров топ-5."], "status": "same"}, {"title": "09. СИСТЕМАТИЧЕСКИЕ НАРУШЕНИЯ", "paras": ["Если один и тот же альянс регулярно нарушает NAP-10, провоцирует конфликты или игнорирует подтвержденные решения лидеров топ-5, его статус в NAP-10 может быть пересмотрен.", "Регулярным нарушением считается не менее 5 подтвержденных нарушений с момента вступления соглашения в силу при периодичности не реже 1 раза в 2 недели.", "Нарушения со стороны лидера альянса или участников R4 считаются более серьезными, чем нарушения обычных участников.", "Исключение альянса из NAP-10 возможно только по правилам голосования, указанным в настоящем соглашении.", "После исключения альянс теряет защиту NAP-10 и больше не считается участником пакта о ненападении."], "status": "same"}, {"title": "10. ПОРЯДОК РЕШЕНИЯ СПОРНЫХ ВОПРОСОВ", "paras": ["В случае конфликта между альянсами, находящимися под действием NAP-10, стороны обязаны сначала попытаться решить вопрос напрямую через лидеров.", "Если конфликт не решен в течение 7 дней, он выносится на совместное обсуждение лидеров топ-5.", "Совместное обсуждение лидеров топ-5 не является отдельным органом власти над сервером. Оно является только площадкой для переговоров и согласования решений.", "Ни один альянс не может быть принужден к решению, с которым он прямо не согласился."], "status": "same"}, {"title": "11. ГОЛОСОВАНИЕ И ПРИНЯТИЕ РЕШЕНИЙ", "paras": ["Все важные решения по развитию сервера, изменению правил, признанию альянса нарушителем, исключению из NAP-10 или ограничению союзов принимаются только единогласно лидерами топ-5.", "Каждый альянс топ-5 имеет один голос.", "Правило большинства не применяется.", "Если единогласия нет, решение не считается принятым, а действующие правила сохраняются без изменений.", "Стороны могут взять до 3 дней на поиск компромисса, но по истечении этого срока решение не принимается автоматически.", "Ни один альянс не имеет права единолично менять правила соглашения."], "status": "same"}, {"title": "12. УСТАНОВЛЕНИЕ СОЮЗОВ", "paras": ["Каждый альянс имеет право заключать индивидуальные союзные соглашения с любым альянсом по своему усмотрению.", "NAP-10 не является союзом и не обязывает альянсы вступать в союзные отношения друг с другом.", "Ни один альянс не может быть принудительно включен в союз или обязан разорвать союз без решения, принятого по правилам настоящего соглашения.", "Требование о разрыве союза возможно только в случае, если союзник регулярно нарушает правила, подрывает стабильность сервера или признан агрессором в порядке, установленном настоящим соглашением.", "Если альянс сознательно укрывает союзника, признанного агрессором, его статус в NAP-10 может быть вынесен на обсуждение лидеров топ-5."], "status": "same"}, {"title": "13. АКАДЕМИИ И ДОЧЕРНИЕ АЛЬЯНСЫ", "paras": ["Академии, филиалы и младшие составы альянсов, находящихся под действием NAP-10, обязаны соблюдать настоящее соглашение.", "Основной альянс несет ответственность за действия своей академии.", "Если академия нарушает NAP-10, лидер основного альянса обязан решить ситуацию и не допустить повторения.", "NAP-10 распространяется на академии и дочерние альянсы участников NAP-10 независимо от их места в рейтинге.", "Нарушение правил в отношении академии приравнивается к нарушению правил в отношении основного альянса.", "Академии и дочерние альянсы участников NAP-10 должны иметь в названии или описании подтверждение своей принадлежности к основному альянсу."], "status": "same"}, {"title": "14. ОГЛАШЕНИЕ РЕШЕНИЙ", "paras": ["Все решения, принятые лидерами топ-5, вступают в силу только после согласования текста всеми сторонами.", "После согласования решение должно быть опубликовано и внесено в настоящее соглашение.", "Запрещено объявлять правила от имени всех лидеров до их полного согласования.", "Публичное объявление несогласованных правил считается провокацией и нарушением настоящего соглашения."], "status": "same"}, {"title": "15. СТАТУС ГАРАНТА СТАБИЛЬНОСТИ СЕРВЕРА", "paras": ["Альянс, занимающий первое место в общем рейтинге силы сервера, признается гарантом стабильности сервера.", "Статус гаранта не является правом единоличного управления сервером, но дает право первоочередной инициативы в вопросах защиты порядка, предотвращения конфликтов и подготовки сервера к межсерверным событиям.", "Гарант стабильности вправе инициировать срочное обсуждение нарушений, предлагать временные меры по предотвращению конфликта и требовать рассмотрения ситуаций, угрожающих стабильности сервера.", "В случае смены первого места в рейтинге статус гаранта переходит к новому альянсу, занимающему первое место."], "status": "same"}, {"title": "16. ВОЕННЫЙ РЕЖИМ НА ВРЕМЯ МЕЖСЕРВЕРНЫХ СОБЫТИЙ", "paras": ["После официального объявления межсерверного события сервер переходит в режим общей координации.", "На период межсерверного события внутренние конфликты, политические споры и действия, ослабляющие сервер, должны быть прекращены.", "Координация действий сервера в межсерверных событиях осуществляется лидерами топ-3 альянсов с учетом фактической силы, активности и вклада каждого альянса.", "Альянс, занимающий первое место в рейтинге силы сервера, имеет право выступать инициатором общего плана действий и распределения ключевых задач на период межсерверного события."], "status": "same"}], "short": [["01. Общие принципы", "Участники действуют добросовестно, не провоцируют конфликты и решают споры через лидеров."], ["02. NAP-10", "Топ-10 соблюдают пакт о ненападении; NAP-10 не является союзом или органом управления."], ["03. Запрет атак", "Атаки между участниками NAP-10 и атаки на плитки запрещены."], ["04. Переманивание", "Переманивание игроков запрещено только между топ-3."], ["05. Черный список", "Токсичные нарушители могут попасть в общий черный список; плитки запрещены всегда."], ["06. Смена лидера", "Смена лидера не отменяет ранее принятые договоренности."], ["07. Грузовики и контейнеры", "В обычный период спорные объекты свободны; во время межсерверных событий атаки внутри сервера запрещены."], ["08. Нарушение", "Альянс нарушителя обязан разобраться, объясниться, компенсировать ущерб и принять меры."], ["09. Систематические нарушения", "Регулярные нарушения могут привести к пересмотру статуса в NAP-10."], ["10. Споры", "Споры сначала решают лидеры напрямую, затем обсуждают лидеры топ-5."], ["11. Голосование", "Важные решения принимаются только единогласно топ-5; большинство не применяется."], ["12. Союзы", "Каждый альянс свободен заключать союзы; NAP-10 не является союзом."], ["13. Академии", "Академии участников NAP-10 защищены и под ответственностью основного альянса."], ["14. Оглашение решений", "Решения публикуются только после полного согласования текста."], ["15. Гарант стабильности", "Альянс #1 — гарант стабильности и имеет право первоочередной инициативы."], ["16. Военный режим", "Во время межсерверных событий внутренние конфликты прекращаются, координация идет через топ-3."]]}, "v2": {"full": [{"title": "ВВЕДЕНИЕ", "paras": ["Настоящее соглашение закрепляет правила взаимодействия альянсов и игроков сервера 98.", "Цель соглашения — сохранить порядок, доверие, стабильность сервера и готовность к межсерверным событиям.", "Соглашение вступает в силу после его подтверждения лидерами альянсов топ-5."], "status": "same"}, {"title": "01. ОБЩИЕ ПРИНЦИПЫ", "paras": ["Все участники соглашения обязуются действовать добросовестно, не провоцировать внутренние конфликты и решать спорные вопросы через прямой диалог лидеров.", "Ни один альянс, лидер или представитель не имеет права говорить от имени всех участников соглашения без прямого согласия всех сторон.", "Любые правила, затрагивающие интересы конкретного альянса, не могут быть приняты без согласия этого альянса."], "status": "same"}, {"title": "02. NAP-10 / ПАКТ О НЕНАПАДЕНИИ ТОП-10", "paras": ["NAP-10 означает Non-Attack Pact — пакт о ненападении между альянсами, входящими в топ-10 общего рейтинга сервера.", "NAP-10 не является союзом, единым альянсом или органом управления сервером. Участие в NAP-10 означает только обязанность соблюдать правила ненападения и иные условия настоящего соглашения.", "В NAP-10 входят альянсы, занимающие места с 1 по 10 в общем рейтинге альянсов.", "Если альянс входит в топ-10, он обязан соблюдать правила NAP-10.", "Если новый альянс поднимается в топ-10, он получает защиту NAP-10 только после принятия условий настоящего соглашения.", "Если альянс временно выпадает из топ-10, его статус может быть отдельно обсужден лидерами альянсов топ-5."], "status": "same"}, {"title": "03. ЗАПРЕТ НА АТАКИ", "paras": ["Любые атаки между альянсами, находящимися под действием NAP-10, запрещены.", "Запрещены атаки на игроков, базы, войска, ресурсы и иные игровые объекты альянсов, находящихся под действием NAP-10.", "Атаки на плитки запрещены на всем сервере 98 для всех игроков и альянсов без исключений, независимо от места альянса в рейтинге и участия в NAP-10.", "Любая атака на плитку считается нарушением общих правил сервера.", "Данное правило не теряет своей силы и распространяется в том числе на нейтральную территорию столицы.", "Любая атака без предварительного согласования между альянсами, находящимися под действием NAP-10, считается нарушением настоящего соглашения."], "status": "changed"}, {"title": "04. ЗАПРЕТ ПЕРЕМАНИВАНИЯ ИГРОКОВ", "paras": ["Запрет на переманивание игроков действует только между альянсами топ-3 общего рейтинга сервера.", "Переманивание игроков из альянсов топ-3 строго запрещено.", "Переход игрока из одного альянса топ-3 в другой возможен только по личной инициативе самого игрока.", "Запрещены давление, уговоры, обещания наград или любые иные действия, направленные на ослабление другого альянса топ-3.", "Если игрок сам просит о переходе, принимающий альянс должен быть готов подтвердить, что инициатива исходила от самого игрока.", "На альянсы ниже топ-3 данный запрет не распространяется, если иное не будет отдельно согласовано всеми лидерами топ-3."], "status": "same"}, {"title": "05. ОБЩИЙ ЧЕРНЫЙ СПИСОК", "paras": ["Если игрок ведет себя токсично, оскорбляет участников, провоцирует конфликты или нарушает правила альянса, он может быть исключен.", "По просьбе одного из альянсов такой игрок может быть внесен в общий черный список.", "Перед внесением игрока в черный список любой альянс вправе запросить доказательства нарушений.", "Если игрок из черного списка был принят в альянс по ошибке, самостоятельные атаки на него запрещены. Альянс, заметивший такую ситуацию, обязан уведомить лидера альянса, принявшего игрока.", "На исключение такого игрока дается 48 часов с момента отправки уведомления лидеру. Если уведомление прочитано и проигнорировано либо за 48 часов решение не принято, разрешается атака только на базу конкретного игрока.", "Атаки на плитки запрещены при любых обстоятельствах, даже в отношении игроков из черного списка, нарушителей или альянсов, не входящих в NAP-10."], "status": "same"}, {"title": "06. СМЕНА ЛИДЕРА АЛЬЯНСА", "paras": ["Смена лидера альянса не отменяет ранее принятые договоренности.", "Все соглашения, подтвержденные прошлым лидером, продолжают действовать в полном объеме.", "Новый лидер принимает на себя ответственность за соблюдение настоящего соглашения."], "status": "same"}, {"title": "07. ГРУЗОВИКИ, КОНТЕЙНЕРЫ И СПОРНЫЕ ОБЪЕКТЫ", "paras": ["Грузовики, контейнеры и аналогичные спорные игровые объекты в обычный период считаются свободной игровой активностью и разрешены для атаки между игроками и альянсами.", "Исключение: после официального объявления межсерверной битвы, открытия межсерверных грабежей или иных событий, связанных с противостоянием серверов, атаки на грузовики, контейнеры и аналогичные объекты между игроками и альянсами сервера 98 запрещены.", "С 29.07.2026 г. стал доступен грабеж других серверов. С этого момента грабеж грузовиков и контейнеров спецопераций между игроками одного сервера полностью запрещён.", "Запрет атак на плитки действует всегда, на всем сервере и не зависит от данного пункта.", "В случае нарушения данного правила допускаются следующие меры воздействия строго в указанном порядке.", "1. Пострадавшая сторона сообщает лидеру альянса о нарушении правила со стороны его игрока.", "В сообщении необходимо указать факт нарушения, ник нарушителя, доказательства нарушения и ник игрока, которому будет предоставлено право санкционного удара.", "Также необходимо сообщить о намерении нанести санкционный удар и предупредить о запрете подкрепления базы нарушителя.", "2. Лидеру альянса нарушителя предоставляется до 24 часов на ответ с момента отправки сообщения о нарушении.", "После получения обратной связи от лидера альянса либо по истечении 24 часов с момента отправки сообщения допускается нанесение одного санкционного удара по базе игрока-нарушителя.", "Одну базу может атаковать только один игрок.", "3. Право нанести санкционный удар имеет игрок, понесший потери вследствие грабежа.", "Если сил данного игрока недостаточно для нанесения удара, он имеет право запросить помощь у более сильного игрока, состоящего с ним в одном альянсе.", "4. Если у игрока-нарушителя находятся подкрепления либо если после санкционного удара игрок-нарушитель совершает ответную атаку, атакующая сторона обязана остановить дальнейшие действия и сообщить об этом лидеру альянса нарушителя.", "Лидер альянса, чей игрок нарушил данные правила, обязан принять меры и остановить дальнейшее нарушение.", "В таком случае допускается применение усиленной санкции — до 5 ударов по базе нарушителя с учетом первого санкционного удара.", "5. Право на санкционный удар возникает только в случае, если пострадавшая сторона заявила о грабеже в течение 24 часов с момента нарушения.", "Если игрок сообщает о грабеже позже указанного срока, право на санкционный удар теряет силу.", "6. Сторона, принимающая санкционный удар, вправе запросить подтверждение нарушения правил в виде отчетов и/или скриншотов.", "В случае отказа атакующей стороны предоставить доказательства атака по базе запрещена."], "status": "changed"}, {"title": "08. НАРУШЕНИЕ СОГЛАШЕНИЯ", "paras": ["Если игрок альянса, находящегося под действием NAP-10, нарушил правила, его альянс обязан разобраться в ситуации, дать объяснение пострадавшей стороне, компенсировать ущерб при подтверждении нарушения, принять меры к нарушителю и не допустить повторения ситуации.", "Если альянс покрывает нарушителя или отказывается решать проблему, вопрос выносится на совместное обсуждение лидеров топ-5."], "status": "same"}, {"title": "09. СИСТЕМАТИЧЕСКИЕ НАРУШЕНИЯ", "paras": ["Если один и тот же альянс регулярно нарушает NAP-10, провоцирует конфликты или игнорирует подтвержденные решения лидеров топ-5, его статус в NAP-10 может быть пересмотрен.", "Регулярным нарушением считается не менее 5 подтвержденных нарушений с момента вступления соглашения в силу при периодичности не реже 1 раза в 2 недели.", "Нарушения со стороны лидера альянса или участников R4 считаются более серьезными, чем нарушения обычных участников.", "Исключение альянса из NAP-10 возможно только по правилам голосования, указанным в настоящем соглашении.", "После исключения альянс теряет защиту NAP-10 и больше не считается участником пакта о ненападении."], "status": "same"}, {"title": "10. ПОРЯДОК РЕШЕНИЯ СПОРНЫХ ВОПРОСОВ", "paras": ["В случае конфликта между альянсами, находящимися под действием NAP-10, стороны обязаны сначала попытаться решить вопрос напрямую через лидеров.", "Если конфликт не решен в течение 7 дней, он выносится на совместное обсуждение лидеров топ-5.", "Совместное обсуждение лидеров топ-5 не является отдельным органом власти над сервером. Оно является только площадкой для переговоров и согласования решений.", "Ни один альянс не может быть принужден к решению, с которым он прямо не согласился."], "status": "same"}, {"title": "11. ГОЛОСОВАНИЕ И ПРИНЯТИЕ РЕШЕНИЙ", "paras": ["Все важные решения по развитию сервера, изменению правил, признанию альянса нарушителем, исключению из NAP-10 или ограничению союзов принимаются только единогласно лидерами топ-5.", "Каждый альянс топ-5 имеет один голос.", "Правило большинства не применяется.", "Если единогласия нет, решение не считается принятым, а действующие правила сохраняются без изменений.", "Стороны могут взять до 3 дней на поиск компромисса, но по истечении этого срока решение не принимается автоматически.", "Ни один альянс не имеет права единолично менять правила соглашения."], "status": "same"}, {"title": "12. УСТАНОВЛЕНИЕ СОЮЗОВ", "paras": ["Каждый альянс имеет право заключать индивидуальные союзные соглашения с любым альянсом по своему усмотрению.", "NAP-10 не является союзом и не обязывает альянсы вступать в союзные отношения друг с другом.", "Ни один альянс не может быть принудительно включен в союз или обязан разорвать союз без решения, принятого по правилам настоящего соглашения.", "Требование о разрыве союза возможно только в случае, если союзник регулярно нарушает правила, подрывает стабильность сервера или признан агрессором в порядке, установленном настоящим соглашением.", "Если альянс сознательно укрывает союзника, признанного агрессором, его статус в NAP-10 может быть вынесен на обсуждение лидеров топ-5."], "status": "same"}, {"title": "13. АКАДЕМИИ И ДОЧЕРНИЕ АЛЬЯНСЫ", "paras": ["Академии, филиалы и младшие составы альянсов, находящихся под действием NAP-10, обязаны соблюдать настоящее соглашение.", "Основной альянс несет ответственность за действия своей академии.", "Если академия нарушает NAP-10, лидер основного альянса обязан решить ситуацию и не допустить повторения.", "NAP-10 распространяется на академии и дочерние альянсы участников NAP-10 независимо от их места в рейтинге.", "Нарушение правил в отношении академии приравнивается к нарушению правил в отношении основного альянса.", "Академии и дочерние альянсы участников NAP-10 должны иметь в названии или описании подтверждение своей принадлежности к основному альянсу."], "status": "same"}, {"title": "14. ОГЛАШЕНИЕ РЕШЕНИЙ", "paras": ["Все решения, принятые лидерами топ-5, вступают в силу только после согласования текста всеми сторонами.", "После согласования решение должно быть опубликовано и внесено в настоящее соглашение.", "Запрещено объявлять правила от имени всех лидеров до их полного согласования.", "Публичное объявление несогласованных правил считается провокацией и нарушением настоящего соглашения."], "status": "same"}, {"title": "15. СТАТУС ГАРАНТА СТАБИЛЬНОСТИ СЕРВЕРА", "paras": ["Альянс, занимающий первое место в общем рейтинге силы сервера, признается гарантом стабильности сервера.", "Статус гаранта не является правом единоличного управления сервером, но дает право первоочередной инициативы в вопросах защиты порядка, предотвращения конфликтов и подготовки сервера к межсерверным событиям.", "Гарант стабильности вправе инициировать срочное обсуждение нарушений, предлагать временные меры по предотвращению конфликта и требовать рассмотрения ситуаций, угрожающих стабильности сервера.", "В случае смены первого места в рейтинге статус гаранта переходит к новому альянсу, занимающему первое место."], "status": "same"}, {"title": "16. ВОЕННЫЙ РЕЖИМ НА ВРЕМЯ МЕЖСЕРВЕРНЫХ СОБЫТИЙ", "paras": ["После официального объявления межсерверного события сервер переходит в режим общей координации.", "На период межсерверного события внутренние конфликты, политические споры и действия, ослабляющие сервер, должны быть прекращены.", "Координация действий сервера в межсерверных событиях осуществляется лидерами топ-3 альянсов с учетом фактической силы, активности и вклада каждого альянса.", "Альянс, занимающий первое место в рейтинге силы сервера, имеет право выступать инициатором общего плана действий и распределения ключевых задач на период межсерверного события."], "status": "same"}, {"title": "17. ЗАКРЕПЛЕНИЕ ГОРОДОВ И МЕСТА В ТОПЕ", "paras": ["В связи с игровыми событиями, межсерверными активностями, войнами и иными обстоятельствами потеря боевой мощи альянсами может быть неизбежной.", "Если альянс временно теряет место в рейтинге, за ним сохраняются ранее закрепленные города и текущий статус сроком на 7 дней с момента изменения рейтинга.", "В течение этого срока альянсу предоставляется возможность восстановить боевую мощь и вернуть прежнее место в рейтинге без потери закрепленных городов.", "До истечения 7 дней перераспределение городов не производится.", "Если в течение 7 дней альянс не восстанавливает боевую мощь и не возвращает прежнее место в рейтинге, закрепленные за ним города перераспределяются согласно текущему рейтингу альянсов.", "Данное правило распространяется как на потерю рейтинга из-за межсерверных событий, войн и боевых потерь, так и на естественное изменение рейтинга между альянсами."], "status": "new"}], "short": [["01. Общие принципы", "Участники действуют добросовестно, не провоцируют конфликты и решают споры через лидеров."], ["02. NAP-10", "Топ-10 соблюдают пакт о ненападении; NAP-10 не является союзом или органом управления."], ["03. Запрет атак", "Атаки между NAP-10 и атаки на плитки запрещены, включая нейтральную территорию столицы."], ["04. Переманивание", "Переманивание игроков запрещено только между топ-3."], ["05. Черный список", "Токсичные нарушители могут попасть в общий черный список; плитки запрещены всегда."], ["06. Смена лидера", "Смена лидера не отменяет ранее принятые договоренности."], ["07. Грузовики и контейнеры", "После открытия межсерверных грабежей грабеж грузовиков и контейнеров между игроками одного сервера запрещён; действует санкционный удар."], ["08. Нарушение", "Альянс нарушителя обязан разобраться, объясниться, компенсировать ущерб и принять меры."], ["09. Систематические нарушения", "Регулярные нарушения могут привести к пересмотру статуса в NAP-10."], ["10. Споры", "Споры сначала решают лидеры напрямую, затем обсуждают лидеры топ-5."], ["11. Голосование", "Важные решения принимаются только единогласно топ-5; большинство не применяется."], ["12. Союзы", "Каждый альянс свободен заключать союзы; NAP-10 не является союзом."], ["13. Академии", "Академии участников NAP-10 защищены и под ответственностью основного альянса."], ["14. Оглашение решений", "Решения публикуются только после полного согласования текста."], ["15. Гарант стабильности", "Альянс #1 — гарант стабильности и имеет право первоочередной инициативы."], ["16. Военный режим", "Во время межсерверных событий внутренние конфликты прекращаются, координация идет через топ-3."], ["17. Города и место в топе", "При временной потере рейтинга города сохраняются 7 дней; если альянс не восстановился, города перераспределяются по текущему рейтингу."]]}, "v3": {"full": [{"title": "ВВЕДЕНИЕ", "paras": ["Настоящее соглашение закрепляет правила взаимодействия альянсов и игроков сервера 98.", "Цель соглашения — сохранить порядок, доверие, стабильность сервера и готовность к межсерверным событиям.", "Соглашение вступает в силу после его подтверждения лидерами альянсов топ-5."], "status": "same"}, {"title": "01. ОБЩИЕ ПРИНЦИПЫ", "paras": ["Все участники соглашения обязуются действовать добросовестно, не провоцировать внутренние конфликты и решать спорные вопросы через прямой диалог лидеров.", "Ни один альянс, лидер или представитель не имеет права говорить от имени всех участников соглашения без прямого согласия всех сторон.", "Любые правила, затрагивающие интересы конкретного альянса, не могут быть приняты без согласия этого альянса."], "status": "same"}, {"title": "02. NAP-10 / ПАКТ О НЕНАПАДЕНИИ ТОП-10", "paras": ["NAP-10 означает Non-Attack Pact — пакт о ненападении между альянсами, входящими в топ-10 общего рейтинга сервера.", "NAP-10 не является союзом, единым альянсом или органом управления сервером. Участие в NAP-10 означает только обязанность соблюдать правила ненападения и иные условия настоящего соглашения.", "В NAP-10 входят альянсы, занимающие места с 1 по 10 в общем рейтинге альянсов.", "Если альянс входит в топ-10, он обязан соблюдать правила NAP-10.", "Если новый альянс поднимается в топ-10, он получает защиту NAP-10 только после принятия условий настоящего соглашения.", "Если альянс временно выпадает из топ-10, его статус может быть отдельно обсужден лидерами альянсов топ-5."], "status": "same"}, {"title": "03. ЗАПРЕТ НА АТАКИ", "paras": ["Любые атаки между альянсами, находящимися под действием NAP-10, запрещены.", "Запрещены атаки на игроков, базы, войска, ресурсы и иные игровые объекты альянсов, находящихся под действием NAP-10.", "Атаки на плитки запрещены на всем сервере 98 для всех игроков и альянсов без исключений, независимо от места альянса в рейтинге и участия в NAP-10.", "Любая атака на плитку считается нарушением общих правил сервера.", "Исключение составляет серая зона столицы на время события по захвату столицы.", "Во время захвата столицы атаки на плитки в серой зоне столицы разрешены.", "Если игрок занимает плитку в серой зоне столицы во время захвата столицы, он принимает риск атаки по этой плитке.", "Игрок, который не хочет попасть под удар, не должен находиться на плитке в серой зоне столицы во время захвата столицы.", "Данное исключение является постоянным правилом сервера 98 и действует на все время существования сервера, пока не будет изменено отдельным решением по правилам настоящего соглашения.", "Данное исключение имеет приоритет над общим запретом атак на плитки на период захвата столицы.", "За пределами серой зоны столицы, а также вне времени события по захвату столицы, общий запрет атак на плитки сохраняется в полном объеме.", "Данное правило распространяется в том числе на нейтральную территорию столицы с учетом исключения для серой зоны во время захвата столицы.", "Любая атака без предварительного согласования между альянсами, находящимися под действием NAP-10, считается нарушением настоящего соглашения."], "status": "changed"}, {"title": "04. ЗАПРЕТ ПЕРЕМАНИВАНИЯ ИГРОКОВ", "paras": ["Запрет на переманивание игроков действует только между альянсами топ-3 общего рейтинга сервера.", "Переманивание игроков из альянсов топ-3 строго запрещено.", "Переход игрока из одного альянса топ-3 в другой возможен только по личной инициативе самого игрока.", "Запрещены давление, уговоры, обещания наград или любые иные действия, направленные на ослабление другого альянса топ-3.", "Если игрок сам просит о переходе, принимающий альянс должен быть готов подтвердить, что инициатива исходила от самого игрока.", "На альянсы ниже топ-3 данный запрет не распространяется, если иное не будет отдельно согласовано всеми лидерами топ-3."], "status": "same"}, {"title": "05. ОБЩИЙ ЧЕРНЫЙ СПИСОК", "paras": ["Если игрок ведет себя токсично, оскорбляет участников, провоцирует конфликты или нарушает правила альянса, он может быть исключен.", "По просьбе одного из альянсов такой игрок может быть внесен в общий черный список.", "Перед внесением игрока в черный список любой альянс вправе запросить доказательства нарушений.", "Если игрок из черного списка был принят в альянс по ошибке, самостоятельные атаки на него запрещены. Альянс, заметивший такую ситуацию, обязан уведомить лидера альянса, принявшего игрока.", "На исключение такого игрока дается 48 часов с момента отправки уведомления лидеру. Если уведомление прочитано и проигнорировано либо за 48 часов решение не принято, разрешается атака только на базу конкретного игрока.", "Атаки на плитки запрещены при любых обстоятельствах, даже в отношении игроков из черного списка, нарушителей или альянсов, не входящих в NAP-10."], "status": "same"}, {"title": "06. СМЕНА ЛИДЕРА АЛЬЯНСА", "paras": ["Смена лидера альянса не отменяет ранее принятые договоренности.", "Все соглашения, подтвержденные прошлым лидером, продолжают действовать в полном объеме.", "Новый лидер принимает на себя ответственность за соблюдение настоящего соглашения."], "status": "same"}, {"title": "07. ГРУЗОВИКИ, КОНТЕЙНЕРЫ И СПОРНЫЕ ОБЪЕКТЫ", "paras": ["Грузовики, контейнеры и аналогичные спорные игровые объекты в обычный период считаются свободной игровой активностью и разрешены для атаки между игроками и альянсами.", "Исключение: после официального объявления межсерверной битвы, открытия межсерверных грабежей или иных событий, связанных с противостоянием серверов, атаки на грузовики, контейнеры и аналогичные объекты между игроками и альянсами сервера 98 запрещены.", "С 29.07.2026 г. стал доступен грабеж других серверов. С этого момента грабеж грузовиков и контейнеров спецопераций между игроками одного сервера полностью запрещён.", "Запрет атак на плитки действует всегда, на всем сервере и не зависит от данного пункта.", "В случае нарушения данного правила допускаются следующие меры воздействия строго в указанном порядке.", "1. Пострадавшая сторона сообщает лидеру альянса о нарушении правила со стороны его игрока.", "В сообщении необходимо указать факт нарушения, ник нарушителя, доказательства нарушения и ник игрока, которому будет предоставлено право санкционного удара.", "Также необходимо сообщить о намерении нанести санкционный удар и предупредить о запрете подкрепления базы нарушителя.", "2. Лидеру альянса нарушителя предоставляется до 24 часов на ответ с момента отправки сообщения о нарушении.", "После получения обратной связи от лидера альянса либо по истечении 24 часов с момента отправки сообщения допускается нанесение одного санкционного удара по базе игрока-нарушителя.", "Одну базу может атаковать только один игрок.", "3. Право нанести санкционный удар имеет игрок, понесший потери вследствие грабежа.", "Если сил данного игрока недостаточно для нанесения удара, он имеет право запросить помощь у более сильного игрока, состоящего с ним в одном альянсе.", "4. Если у игрока-нарушителя находятся подкрепления либо если после санкционного удара игрок-нарушитель совершает ответную атаку, атакующая сторона обязана остановить дальнейшие действия и сообщить об этом лидеру альянса нарушителя.", "Лидер альянса, чей игрок нарушил данные правила, обязан принять меры и остановить дальнейшее нарушение.", "В таком случае допускается применение усиленной санкции — до 5 ударов по базе нарушителя с учетом первого санкционного удара.", "5. Право на санкционный удар возникает только в случае, если пострадавшая сторона заявила о грабеже в течение 24 часов с момента нарушения.", "Если игрок сообщает о грабеже позже указанного срока, право на санкционный удар теряет силу.", "6. Сторона, принимающая санкционный удар, вправе запросить подтверждение нарушения правил в виде отчетов и/или скриншотов.", "В случае отказа атакующей стороны предоставить доказательства атака по базе запрещена."], "status": "same"}, {"title": "08. НАРУШЕНИЕ СОГЛАШЕНИЯ", "paras": ["Если игрок альянса, находящегося под действием NAP-10, нарушил правила, его альянс обязан разобраться в ситуации, дать объяснение пострадавшей стороне, компенсировать ущерб при подтверждении нарушения, принять меры к нарушителю и не допустить повторения ситуации.", "Если альянс покрывает нарушителя или отказывается решать проблему, вопрос выносится на совместное обсуждение лидеров топ-5."], "status": "same"}, {"title": "09. СИСТЕМАТИЧЕСКИЕ НАРУШЕНИЯ", "paras": ["Если один и тот же альянс регулярно нарушает NAP-10, провоцирует конфликты или игнорирует подтвержденные решения лидеров топ-5, его статус в NAP-10 может быть пересмотрен.", "Регулярным нарушением считается не менее 5 подтвержденных нарушений с момента вступления соглашения в силу при периодичности не реже 1 раза в 2 недели.", "Нарушения со стороны лидера альянса или участников R4 считаются более серьезными, чем нарушения обычных участников.", "Исключение альянса из NAP-10 возможно только по правилам голосования, указанным в настоящем соглашении.", "После исключения альянс теряет защиту NAP-10 и больше не считается участником пакта о ненападении."], "status": "same"}, {"title": "10. ПОРЯДОК РЕШЕНИЯ СПОРНЫХ ВОПРОСОВ", "paras": ["В случае конфликта между альянсами, находящимися под действием NAP-10, стороны обязаны сначала попытаться решить вопрос напрямую через лидеров.", "Если конфликт не решен в течение 7 дней, он выносится на совместное обсуждение лидеров топ-5.", "Совместное обсуждение лидеров топ-5 не является отдельным органом власти над сервером. Оно является только площадкой для переговоров и согласования решений.", "Ни один альянс не может быть принужден к решению, с которым он прямо не согласился."], "status": "same"}, {"title": "11. ГОЛОСОВАНИЕ И ПРИНЯТИЕ РЕШЕНИЙ", "paras": ["Все важные решения по развитию сервера, изменению правил, признанию альянса нарушителем, исключению из NAP-10 или ограничению союзов принимаются только единогласно лидерами топ-5.", "Каждый альянс топ-5 имеет один голос.", "Правило большинства не применяется.", "Если единогласия нет, решение не считается принятым, а действующие правила сохраняются без изменений.", "Стороны могут взять до 3 дней на поиск компромисса, но по истечении этого срока решение не принимается автоматически.", "Ни один альянс не имеет права единолично менять правила соглашения."], "status": "same"}, {"title": "12. УСТАНОВЛЕНИЕ СОЮЗОВ", "paras": ["Каждый альянс имеет право заключать индивидуальные союзные соглашения с любым альянсом по своему усмотрению.", "NAP-10 не является союзом и не обязывает альянсы вступать в союзные отношения друг с другом.", "Ни один альянс не может быть принудительно включен в союз или обязан разорвать союз без решения, принятого по правилам настоящего соглашения.", "Требование о разрыве союза возможно только в случае, если союзник регулярно нарушает правила, подрывает стабильность сервера или признан агрессором в порядке, установленном настоящим соглашением.", "Если альянс сознательно укрывает союзника, признанного агрессором, его статус в NAP-10 может быть вынесен на обсуждение лидеров топ-5."], "status": "same"}, {"title": "13. АКАДЕМИИ И ДОЧЕРНИЕ АЛЬЯНСЫ", "paras": ["Академии, филиалы и младшие составы альянсов, находящихся под действием NAP-10, обязаны соблюдать настоящее соглашение.", "Основной альянс несет ответственность за действия своей академии.", "Если академия нарушает NAP-10, лидер основного альянса обязан решить ситуацию и не допустить повторения.", "NAP-10 распространяется на академии и дочерние альянсы участников NAP-10 независимо от их места в рейтинге.", "Нарушение правил в отношении академии приравнивается к нарушению правил в отношении основного альянса.", "Академии и дочерние альянсы участников NAP-10 должны иметь в названии или описании подтверждение своей принадлежности к основному альянсу."], "status": "same"}, {"title": "14. ОГЛАШЕНИЕ РЕШЕНИЙ", "paras": ["Все решения, принятые лидерами топ-5, вступают в силу только после согласования текста всеми сторонами.", "После согласования решение должно быть опубликовано и внесено в настоящее соглашение.", "Запрещено объявлять правила от имени всех лидеров до их полного согласования.", "Публичное объявление несогласованных правил считается провокацией и нарушением настоящего соглашения."], "status": "same"}, {"title": "15. СТАТУС ГАРАНТА СТАБИЛЬНОСТИ СЕРВЕРА", "paras": ["Альянс, занимающий первое место в общем рейтинге силы сервера, признается гарантом стабильности сервера.", "Статус гаранта не является правом единоличного управления сервером, но дает право первоочередной инициативы в вопросах защиты порядка, предотвращения конфликтов и подготовки сервера к межсерверным событиям.", "Гарант стабильности вправе инициировать срочное обсуждение нарушений, предлагать временные меры по предотвращению конфликта и требовать рассмотрения ситуаций, угрожающих стабильности сервера.", "В случае смены первого места в рейтинге статус гаранта переходит к новому альянсу, занимающему первое место."], "status": "same"}, {"title": "16. ВОЕННЫЙ РЕЖИМ НА ВРЕМЯ МЕЖСЕРВЕРНЫХ СОБЫТИЙ", "paras": ["После официального объявления межсерверного события сервер переходит в режим общей координации.", "На период межсерверного события внутренние конфликты, политические споры и действия, ослабляющие сервер, должны быть прекращены.", "Координация действий сервера в межсерверных событиях осуществляется лидерами топ-3 альянсов с учетом фактической силы, активности и вклада каждого альянса.", "Альянс, занимающий первое место в рейтинге силы сервера, имеет право выступать инициатором общего плана действий и распределения ключевых задач на период межсерверного события."], "status": "same"}, {"title": "17. ЗАКРЕПЛЕНИЕ ГОРОДОВ И МЕСТА В ТОПЕ", "paras": ["В связи с игровыми событиями, межсерверными активностями, войнами и иными обстоятельствами потеря боевой мощи альянсами может быть неизбежной.", "Если альянс временно теряет место в рейтинге, за ним сохраняются ранее закрепленные города и текущий статус сроком на 7 дней с момента изменения рейтинга.", "В течение этого срока альянсу предоставляется возможность восстановить боевую мощь и вернуть прежнее место в рейтинге без потери закрепленных городов.", "До истечения 7 дней перераспределение городов не производится.", "Если в течение 7 дней альянс не восстанавливает боевую мощь и не возвращает прежнее место в рейтинге, закрепленные за ним города перераспределяются согласно текущему рейтингу альянсов.", "Данное правило распространяется как на потерю рейтинга из-за межсерверных событий, войн и боевых потерь, так и на естественное изменение рейтинга между альянсами."], "status": "same"}], "short": [["01. Общие принципы", "Участники действуют добросовестно, не провоцируют конфликты и решают споры через лидеров."], ["02. NAP-10", "Топ-10 соблюдают пакт о ненападении; NAP-10 не является союзом или органом управления."], ["03. Запрет атак", "Атаки между NAP-10 и атаки на плитки запрещены, но во время захвата столицы плитки в серой зоне столицы разрешены для атаки."], ["04. Переманивание", "Переманивание игроков запрещено только между топ-3."], ["05. Черный список", "Токсичные нарушители могут попасть в общий черный список; плитки запрещены всегда."], ["06. Смена лидера", "Смена лидера не отменяет ранее принятые договоренности."], ["07. Грузовики и контейнеры", "После открытия межсерверных грабежей грабеж грузовиков и контейнеров между игроками одного сервера запрещён; действует санкционный удар."], ["08. Нарушение", "Альянс нарушителя обязан разобраться, объясниться, компенсировать ущерб и принять меры."], ["09. Систематические нарушения", "Регулярные нарушения могут привести к пересмотру статуса в NAP-10."], ["10. Споры", "Споры сначала решают лидеры напрямую, затем обсуждают лидеры топ-5."], ["11. Голосование", "Важные решения принимаются только единогласно топ-5; большинство не применяется."], ["12. Союзы", "Каждый альянс свободен заключать союзы; NAP-10 не является союзом."], ["13. Академии", "Академии участников NAP-10 защищены и под ответственностью основного альянса."], ["14. Оглашение решений", "Решения публикуются только после полного согласования текста."], ["15. Гарант стабильности", "Альянс #1 — гарант стабильности и имеет право первоочередной инициативы."], ["16. Военный режим", "Во время межсерверных событий внутренние конфликты прекращаются, координация идет через топ-3."], ["17. Города и место в топе", "При временной потере рейтинга города сохраняются 7 дней; если альянс не восстановился, города перераспределяются по текущему рейтингу."]]}}, "en": {"v1": {"full": [{"title": "INTRODUCTION", "paras": ["This agreement establishes the rules of interaction between the alliances and players of Server 98.", "The purpose of this agreement is to preserve order, trust, server stability, and readiness for cross-server events.", "This agreement enters into force after it is confirmed by the leaders of the top-5 alliances."], "status": "same"}, {"title": "01. GENERAL PRINCIPLES", "paras": ["All participants of this agreement must act in good faith, avoid provoking internal conflicts, and resolve disputes through direct dialogue between leaders.", "No alliance, leader, or representative may speak on behalf of all participants of the agreement without the direct consent of all parties.", "Any rule that affects the interests of a specific alliance cannot be adopted without that alliance’s consent."], "status": "same"}, {"title": "02. NAP-10 / NON-ATTACK PACT OF THE TOP-10", "paras": ["NAP-10 means Non-Attack Pact: a non-attack agreement between the alliances ranked in the top-10 of the server’s overall alliance ranking.", "NAP-10 is not an alliance, a unified coalition, or a governing body of the server. Participation in NAP-10 only means the obligation to follow the non-attack rules and the other terms of this agreement.", "NAP-10 includes the alliances ranked from 1st to 10th in the overall alliance ranking.", "If an alliance is in the top-10, it must comply with the NAP-10 rules.", "If a new alliance enters the top-10, it receives NAP-10 protection only after accepting the terms of this agreement.", "If an alliance temporarily drops out of the top-10, its status may be separately discussed by the leaders of the top-5 alliances."], "status": "same"}, {"title": "03. ATTACK BAN", "paras": ["Any attacks between alliances under NAP-10 are prohibited.", "Attacks on players, bases, troops, resources, and any other game objects of alliances under NAP-10 are prohibited.", "Tile attacks are prohibited across all of Server 98 for all players and alliances without exception, regardless of alliance ranking or participation in NAP-10.", "Any attack on a tile is considered a violation of the general server rules.", "Any attack without prior coordination between alliances under NAP-10 is considered a violation of this agreement."], "status": "same"}, {"title": "04. BAN ON PLAYER POACHING", "paras": ["The ban on player poaching applies only between the top-3 alliances in the overall server ranking.", "Poaching players from top-3 alliances is strictly prohibited.", "A player may move from one top-3 alliance to another only by the player’s own personal initiative.", "Pressure, persuasion, promises of rewards, or any other actions aimed at weakening another top-3 alliance are prohibited.", "If a player requests a transfer on their own, the receiving alliance must be ready to prove that the initiative came from the player.", "This ban does not apply to alliances below the top-3 unless otherwise separately agreed by all top-3 leaders."], "status": "same"}, {"title": "05. SHARED BLACKLIST", "paras": ["If a player behaves toxically, insults members, provokes conflicts, or violates alliance rules, that player may be removed from the alliance.", "At the request of one of the alliances, such a player may be added to the shared blacklist.", "Before adding a player to the blacklist, any alliance has the right to request evidence of the violations.", "If a blacklisted player was accepted into an alliance by mistake, independent attacks against that player are prohibited. The alliance that notices the situation must notify the leader of the alliance that accepted the player.", "The alliance has 48 hours from the moment the notification is sent to remove that player. If the notification is read and ignored, or if no decision is made within 48 hours, attacks are allowed only against that specific player’s base.", "Tile attacks remain prohibited under all circumstances, even against blacklisted players, violators, or alliances not included in NAP-10."], "status": "same"}, {"title": "06. CHANGE OF ALLIANCE LEADER", "paras": ["A change of alliance leader does not cancel previously accepted agreements.", "All agreements confirmed by the previous leader remain fully valid.", "The new leader assumes responsibility for complying with this agreement."], "status": "same"}, {"title": "07. TRUCKS, CONTAINERS, AND CONTESTED OBJECTS", "paras": ["Trucks, containers, and similar contested game objects may be attacked by players and alliances.", "These objects are considered free game activity and are not covered by the attack ban.", "Exception: after an official cross-server battle is announced and cross-server raids are opened, attacks on trucks, containers, and similar objects between alliances of Server 98 are prohibited.", "The tile attack ban always applies across the whole server and is not affected by this section."], "status": "same"}, {"title": "08. VIOLATION OF THE AGREEMENT", "paras": ["If a player from an alliance under NAP-10 violates the rules, that player’s alliance must investigate the situation, provide an explanation to the affected party, compensate the damage if the violation is confirmed, take measures against the violator, and prevent the situation from repeating.", "If an alliance protects the violator or refuses to resolve the problem, the matter is submitted for joint discussion by the leaders of the top-5 alliances."], "status": "same"}, {"title": "09. SYSTEMATIC VIOLATIONS", "paras": ["If the same alliance regularly violates NAP-10, provokes conflicts, or ignores confirmed decisions of the top-5 leaders, its NAP-10 status may be reviewed.", "A regular violation means at least 5 confirmed violations since the agreement entered into force, with a frequency of at least once every 2 weeks.", "Violations by the alliance leader or R4 members are considered more serious than violations by ordinary members.", "An alliance can be excluded from NAP-10 only according to the voting rules set out in this agreement.", "After exclusion, the alliance loses NAP-10 protection and is no longer considered a participant in the Non-Attack Pact."], "status": "same"}, {"title": "10. PROCEDURE FOR RESOLVING DISPUTES", "paras": ["In case of a conflict between alliances under NAP-10, the parties must first try to resolve the issue directly through their leaders.", "If the conflict is not resolved within 7 days, it is submitted for joint discussion by the leaders of the top-5 alliances.", "The joint discussion of the top-5 leaders is not a separate authority over the server. It is only a platform for negotiation and coordination of decisions.", "No alliance may be forced to accept a decision with which it directly disagrees."], "status": "same"}, {"title": "11. VOTING AND DECISION-MAKING", "paras": ["All important decisions regarding server development, rule changes, recognition of an alliance as a violator, exclusion from NAP-10, or restrictions on alliances must be made unanimously by the leaders of the top-5 alliances.", "Each top-5 alliance has one vote.", "Majority rule does not apply.", "If there is no unanimity, the decision is not adopted, and the existing rules remain unchanged.", "The parties may take up to 3 days to search for a compromise, but no decision is adopted automatically after that period expires.", "No alliance has the right to change the rules of this agreement unilaterally."], "status": "same"}, {"title": "12. FORMING ALLIANCES", "paras": ["Each alliance has the right to enter into individual alliance agreements with any other alliance at its own discretion.", "NAP-10 is not an alliance and does not require alliances to enter into alliance relations with each other.", "No alliance may be forcibly included in an alliance or forced to break an alliance without a decision adopted under the rules of this agreement.", "A demand to break an alliance is possible only if the allied party regularly violates the rules, undermines server stability, or is recognized as an aggressor under the procedure established by this agreement.", "If an alliance knowingly shelters an ally recognized as an aggressor, its NAP-10 status may be submitted for discussion by the leaders of the top-5 alliances."], "status": "same"}, {"title": "13. ACADEMIES AND SUBSIDIARY ALLIANCES", "paras": ["Academies, branches, and junior rosters of alliances under NAP-10 must comply with this agreement.", "The main alliance is responsible for the actions of its academy.", "If an academy violates NAP-10, the leader of the main alliance must resolve the situation and prevent it from repeating.", "NAP-10 applies to academies and subsidiary alliances of NAP-10 participants regardless of their ranking position.", "A violation against an academy is treated as a violation against the main alliance.", "Academies and subsidiary alliances of NAP-10 participants must indicate their connection to the main alliance in their name or description."], "status": "same"}, {"title": "14. ANNOUNCEMENT OF DECISIONS", "paras": ["All decisions adopted by the top-5 leaders enter into force only after the wording has been agreed by all parties.", "After approval, the decision must be published and added to this agreement.", "It is prohibited to announce rules on behalf of all leaders before they are fully agreed.", "Public announcement of unapproved rules is considered a provocation and a violation of this agreement."], "status": "same"}, {"title": "15. STATUS OF SERVER STABILITY GUARANTOR", "paras": ["The alliance ranked first in the overall server power ranking is recognized as the guarantor of server stability.", "The status of guarantor does not grant the right to rule the server alone, but it grants the right of first initiative in matters of protecting order, preventing conflicts, and preparing the server for cross-server events.", "The stability guarantor may initiate urgent discussion of violations, propose temporary measures to prevent conflict, and demand review of situations that threaten server stability.", "If first place in the power ranking changes, the guarantor status passes to the new alliance ranked first."], "status": "same"}, {"title": "16. WAR MODE DURING CROSS-SERVER EVENTS", "paras": ["After an official cross-server event is announced, the server enters a mode of general coordination.", "During a cross-server event, internal conflicts, political disputes, and actions that weaken the server must be stopped.", "Coordination of the server’s actions in cross-server events is carried out by the leaders of the top-3 alliances, taking into account the actual power, activity, and contribution of each alliance.", "The alliance ranked first in server power has the right to initiate the general action plan and distribute key tasks for the duration of the cross-server event."], "status": "same"}], "short": [["01. General principles", "Participants act in good faith, avoid conflicts, and resolve disputes through leaders."], ["02. NAP-10", "Top-10 alliances follow the Non-Attack Pact; NAP-10 is not an alliance or governing body."], ["03. Attack ban", "Attacks between NAP-10 participants and tile attacks are prohibited."], ["04. Player poaching", "Player poaching is prohibited only between the top-3 alliances."], ["05. Shared blacklist", "Toxic violators may be added to the shared blacklist; tile attacks are always prohibited."], ["06. Leader change", "A leader change does not cancel previously accepted agreements."], ["07. Trucks and containers", "During ordinary periods contested objects are free; during cross-server events internal server attacks are prohibited."], ["08. Violation", "The violator’s alliance must investigate, explain, compensate damage, and take measures."], ["09. Systematic violations", "Regular violations may lead to a review of NAP-10 status."], ["10. Disputes", "Disputes are first handled directly by leaders, then by top-5 discussion."], ["11. Voting", "Important decisions require unanimous top-5 approval; majority rule does not apply."], ["12. Alliances", "Each alliance may freely form alliances; NAP-10 is not an alliance."], ["13. Academies", "Academies of NAP-10 participants are protected and remain the responsibility of the main alliance."], ["14. Announcements", "Decisions are published only after full approval of the wording."], ["15. Stability guarantor", "The #1 alliance is the stability guarantor and has the right of first initiative."], ["16. War mode", "During cross-server events internal conflicts stop; coordination goes through the top-3."]]}, "v2": {"full": [{"title": "INTRODUCTION", "paras": ["This agreement establishes the rules of interaction between the alliances and players of Server 98.", "The purpose of this agreement is to preserve order, trust, server stability, and readiness for cross-server events.", "This agreement enters into force after it is confirmed by the leaders of the top-5 alliances."], "status": "same"}, {"title": "01. GENERAL PRINCIPLES", "paras": ["All participants of this agreement must act in good faith, avoid provoking internal conflicts, and resolve disputes through direct dialogue between leaders.", "No alliance, leader, or representative may speak on behalf of all participants of the agreement without the direct consent of all parties.", "Any rule that affects the interests of a specific alliance cannot be adopted without that alliance’s consent."], "status": "same"}, {"title": "02. NAP-10 / NON-ATTACK PACT OF THE TOP-10", "paras": ["NAP-10 means Non-Attack Pact: a non-attack agreement between the alliances ranked in the top-10 of the server’s overall alliance ranking.", "NAP-10 is not an alliance, a unified coalition, or a governing body of the server. Participation in NAP-10 only means the obligation to follow the non-attack rules and the other terms of this agreement.", "NAP-10 includes the alliances ranked from 1st to 10th in the overall alliance ranking.", "If an alliance is in the top-10, it must comply with the NAP-10 rules.", "If a new alliance enters the top-10, it receives NAP-10 protection only after accepting the terms of this agreement.", "If an alliance temporarily drops out of the top-10, its status may be separately discussed by the leaders of the top-5 alliances."], "status": "same"}, {"title": "03. ATTACK BAN", "paras": ["Any attacks between alliances under NAP-10 are prohibited.", "Attacks on players, bases, troops, resources, and any other game objects of alliances under NAP-10 are prohibited.", "Tile attacks are prohibited across all of Server 98 for all players and alliances without exception, regardless of alliance ranking or participation in NAP-10.", "Any attack on a tile is considered a violation of the general server rules.", "This rule remains fully valid and also applies to the neutral territory of the Capital.", "Any attack without prior coordination between alliances under NAP-10 is considered a violation of this agreement."], "status": "changed"}, {"title": "04. BAN ON PLAYER POACHING", "paras": ["The ban on player poaching applies only between the top-3 alliances in the overall server ranking.", "Poaching players from top-3 alliances is strictly prohibited.", "A player may move from one top-3 alliance to another only by the player’s own personal initiative.", "Pressure, persuasion, promises of rewards, or any other actions aimed at weakening another top-3 alliance are prohibited.", "If a player requests a transfer on their own, the receiving alliance must be ready to prove that the initiative came from the player.", "This ban does not apply to alliances below the top-3 unless otherwise separately agreed by all top-3 leaders."], "status": "same"}, {"title": "05. SHARED BLACKLIST", "paras": ["If a player behaves toxically, insults members, provokes conflicts, or violates alliance rules, that player may be removed from the alliance.", "At the request of one of the alliances, such a player may be added to the shared blacklist.", "Before adding a player to the blacklist, any alliance has the right to request evidence of the violations.", "If a blacklisted player was accepted into an alliance by mistake, independent attacks against that player are prohibited. The alliance that notices the situation must notify the leader of the alliance that accepted the player.", "The alliance has 48 hours from the moment the notification is sent to remove that player. If the notification is read and ignored, or if no decision is made within 48 hours, attacks are allowed only against that specific player’s base.", "Tile attacks remain prohibited under all circumstances, even against blacklisted players, violators, or alliances not included in NAP-10."], "status": "same"}, {"title": "06. CHANGE OF ALLIANCE LEADER", "paras": ["A change of alliance leader does not cancel previously accepted agreements.", "All agreements confirmed by the previous leader remain fully valid.", "The new leader assumes responsibility for complying with this agreement."], "status": "same"}, {"title": "07. TRUCKS, CONTAINERS, AND CONTESTED OBJECTS", "paras": ["During ordinary periods, trucks, containers, and similar contested game objects are considered free game activity and may be attacked by players and alliances.", "Exception: after an official cross-server battle is announced, cross-server raids are opened, or other events related to server-versus-server confrontation begin, attacks on trucks, containers, and similar objects between players and alliances of Server 98 are prohibited.", "Since 29.07.2026, raids on other servers have become available. From that moment, raiding trucks and special-operation containers between players of the same server is completely prohibited.", "The tile attack ban always applies across the whole server and is not affected by this section.", "If this rule is violated, the following measures may be applied strictly in the order listed below.", "1. The affected side notifies the alliance leader about the violation committed by that leader’s player.", "The message must include the fact of the violation, the violator’s nickname, evidence of the violation, and the nickname of the player who will be granted the right to carry out the sanction strike.", "The message must also state the intention to carry out a sanction strike and warn that reinforcements to the violator’s base are prohibited.", "2. The violator’s alliance leader has up to 24 hours to respond from the moment the violation message is sent.", "After receiving feedback from the alliance leader, or after 24 hours from sending the message, one sanction strike against the violator’s base is allowed.", "Only one player may attack one base.", "3. The right to carry out the sanction strike belongs to the player who suffered losses as a result of the raid.", "If that player is not strong enough to carry out the strike, they may request help from a stronger player from the same alliance.", "4. If the violator’s base has reinforcements, or if after the sanction strike the violator launches a counterattack, the attacking side must stop further action and notify the violator’s alliance leader.", "The leader of the alliance whose player violated these rules must take measures and stop the further violation.", "In this case, an enhanced sanction of up to 5 strikes against the violator’s base is allowed, including the first sanction strike.", "5. The right to a sanction strike arises only if the affected side reports the raid within 24 hours from the moment of the violation.", "If the player reports the raid after that period, the right to a sanction strike loses force.", "6. The side receiving the sanction strike has the right to request confirmation of the rule violation in the form of reports and/or screenshots.", "If the attacking side refuses to provide evidence, the attack on the base is prohibited."], "status": "changed"}, {"title": "08. VIOLATION OF THE AGREEMENT", "paras": ["If a player from an alliance under NAP-10 violates the rules, that player’s alliance must investigate the situation, provide an explanation to the affected party, compensate the damage if the violation is confirmed, take measures against the violator, and prevent the situation from repeating.", "If an alliance protects the violator or refuses to resolve the problem, the matter is submitted for joint discussion by the leaders of the top-5 alliances."], "status": "same"}, {"title": "09. SYSTEMATIC VIOLATIONS", "paras": ["If the same alliance regularly violates NAP-10, provokes conflicts, or ignores confirmed decisions of the top-5 leaders, its NAP-10 status may be reviewed.", "A regular violation means at least 5 confirmed violations since the agreement entered into force, with a frequency of at least once every 2 weeks.", "Violations by the alliance leader or R4 members are considered more serious than violations by ordinary members.", "An alliance can be excluded from NAP-10 only according to the voting rules set out in this agreement.", "After exclusion, the alliance loses NAP-10 protection and is no longer considered a participant in the Non-Attack Pact."], "status": "same"}, {"title": "10. PROCEDURE FOR RESOLVING DISPUTES", "paras": ["In case of a conflict between alliances under NAP-10, the parties must first try to resolve the issue directly through their leaders.", "If the conflict is not resolved within 7 days, it is submitted for joint discussion by the leaders of the top-5 alliances.", "The joint discussion of the top-5 leaders is not a separate authority over the server. It is only a platform for negotiation and coordination of decisions.", "No alliance may be forced to accept a decision with which it directly disagrees."], "status": "same"}, {"title": "11. VOTING AND DECISION-MAKING", "paras": ["All important decisions regarding server development, rule changes, recognition of an alliance as a violator, exclusion from NAP-10, or restrictions on alliances must be made unanimously by the leaders of the top-5 alliances.", "Each top-5 alliance has one vote.", "Majority rule does not apply.", "If there is no unanimity, the decision is not adopted, and the existing rules remain unchanged.", "The parties may take up to 3 days to search for a compromise, but no decision is adopted automatically after that period expires.", "No alliance has the right to change the rules of this agreement unilaterally."], "status": "same"}, {"title": "12. FORMING ALLIANCES", "paras": ["Each alliance has the right to enter into individual alliance agreements with any other alliance at its own discretion.", "NAP-10 is not an alliance and does not require alliances to enter into alliance relations with each other.", "No alliance may be forcibly included in an alliance or forced to break an alliance without a decision adopted under the rules of this agreement.", "A demand to break an alliance is possible only if the allied party regularly violates the rules, undermines server stability, or is recognized as an aggressor under the procedure established by this agreement.", "If an alliance knowingly shelters an ally recognized as an aggressor, its NAP-10 status may be submitted for discussion by the leaders of the top-5 alliances."], "status": "same"}, {"title": "13. ACADEMIES AND SUBSIDIARY ALLIANCES", "paras": ["Academies, branches, and junior rosters of alliances under NAP-10 must comply with this agreement.", "The main alliance is responsible for the actions of its academy.", "If an academy violates NAP-10, the leader of the main alliance must resolve the situation and prevent it from repeating.", "NAP-10 applies to academies and subsidiary alliances of NAP-10 participants regardless of their ranking position.", "A violation against an academy is treated as a violation against the main alliance.", "Academies and subsidiary alliances of NAP-10 participants must indicate their connection to the main alliance in their name or description."], "status": "same"}, {"title": "14. ANNOUNCEMENT OF DECISIONS", "paras": ["All decisions adopted by the top-5 leaders enter into force only after the wording has been agreed by all parties.", "After approval, the decision must be published and added to this agreement.", "It is prohibited to announce rules on behalf of all leaders before they are fully agreed.", "Public announcement of unapproved rules is considered a provocation and a violation of this agreement."], "status": "same"}, {"title": "15. STATUS OF SERVER STABILITY GUARANTOR", "paras": ["The alliance ranked first in the overall server power ranking is recognized as the guarantor of server stability.", "The status of guarantor does not grant the right to rule the server alone, but it grants the right of first initiative in matters of protecting order, preventing conflicts, and preparing the server for cross-server events.", "The stability guarantor may initiate urgent discussion of violations, propose temporary measures to prevent conflict, and demand review of situations that threaten server stability.", "If first place in the power ranking changes, the guarantor status passes to the new alliance ranked first."], "status": "same"}, {"title": "16. WAR MODE DURING CROSS-SERVER EVENTS", "paras": ["After an official cross-server event is announced, the server enters a mode of general coordination.", "During a cross-server event, internal conflicts, political disputes, and actions that weaken the server must be stopped.", "Coordination of the server’s actions in cross-server events is carried out by the leaders of the top-3 alliances, taking into account the actual power, activity, and contribution of each alliance.", "The alliance ranked first in server power has the right to initiate the general action plan and distribute key tasks for the duration of the cross-server event."], "status": "same"} let state = { lang: "ru", version: "v3", mode: "full" };

function setState(k, v) {
  state[k] = v;
  render();
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}

function render() {
  const items = DATA[state.lang][state.version][state.mode];
  const ru = state.lang === "ru";
  document.documentElement.lang = state.lang;
  if (window.__zrouteApplyTheme) window.__zrouteApplyTheme(document.documentElement.getAttribute("data-theme") || "dark");

  document.getElementById("page-title").textContent = ru
    ? "СОЮЗНОЕ СОГЛАШЕНИЕ СЕРВЕРА 98"
    : "SERVER 98 ALLIANCE AGREEMENT";
  document.getElementById("page-subtitle").textContent = ru
    ? "Редакция " + state.version.replace("v", "") + ".0. Полная и краткая версии правил, RU / EN. Изменения текущей версии подсвечены цветом."
    : "Version " + state.version.replace("v", "") + ".0. Full and short rules, RU / EN. Changes in the current version are highlighted.";

  document.getElementById("btn-full").textContent = ru ? "Полная" : "Full";
  document.getElementById("btn-short").textContent = ru ? "Краткая" : "Short";
  document.getElementById("legend-changed").textContent = ru ? "Изменено в текущей версии" : "Changed in this version";
  document.getElementById("legend-new").textContent = ru ? "Новое в текущей версии" : "New in this version";

  document.getElementById("footer-text").textContent = ru
    ? "Неофициальная публикация правил сервера 98. Текст может быть обновлён после согласования лидерами альянсов."
    : "Unofficial publication of Server 98 rules. The text may be updated after approval by alliance leaders.";

  document.getElementById("note").textContent =
    state.version === "v3"
      ? (ru
        ? "Вы смотрите редакцию 3.0. Относительно версии 2.0 изменён только пункт 03 про атаки на плитки в серой зоне столицы во время захвата столицы."
        : "You are viewing version 3.0. Compared with version 2.0, only Section 03 about tile attacks in the Capital gray zone during Capital capture has changed.")
      : state.version === "v2"
      ? (ru
        ? "Вы смотрите редакцию 2.0. Относительно версии 1.0 изменены пункты 03 и 07, а пункт 17 добавлен как новый."
        : "You are viewing version 2.0. Compared with version 1.0, Sections 03 and 07 were changed, and Section 17 was added.")
      : (ru
        ? "Вы смотрите редакцию 1.0. Это исходная версия правил без последующих изменений."
        : "You are viewing version 1.0. This is the original version without later changes.");

  ["ru", "en"].forEach(function (x) {
    document.getElementById("btn-" + x).classList.toggle("active", state.lang === x);
  });
  ["v1", "v2", "v3"].forEach(function (x) {
    document.getElementById("btn-" + x).classList.toggle("active", state.version === x);
  });
  ["full", "short"].forEach(function (x) {
    document.getElementById("btn-" + x).classList.toggle("active", state.mode === x);
  });

  let html = "";
  if (state.mode === "full") {
    items.forEach(function (s) {
      const cls = s.status === "changed" ? "changed" : s.status === "new" ? "new" : "";
      const badge =
        s.status === "changed"
          ? '<span class="badge changed-badge">' + (ru ? "изменено" : "changed") + "</span>"
          : s.status === "new"
          ? '<span class="badge new-badge">' + (ru ? "новое" : "new") + "</span>"
          : "";
      html +=
        '<section class="panel ' + cls + '"><h2>' + esc(s.title) + " " + badge + "</h2>" +
        s.paras.map(function (p) { return "<p>" + esc(p) + "</p>"; }).join("") +
        "</section>";
    });
  } else {
    items.forEach(function (s) {
      const title = s[0];
      const txt = s[1];
      let status = "";
      if (state.version === "v2" && (title.startsWith("03") || title.startsWith("07"))) status = "changed";
      if (state.version === "v2" && title.startsWith("17")) status = "new";
      if (state.version === "v3" && title.startsWith("03")) status = "changed";
      const badge =
        status === "changed"
          ? '<span class="badge changed-badge">' + (ru ? "изменено" : "changed") + "</span>"
          : status === "new"
          ? '<span class="badge new-badge">' + (ru ? "новое" : "new") + "</span>"
          : "";
      html +=
        '<section class="panel ' + status + '"><h2>' + esc(title) + " " + badge +
        "</h2><p>" + esc(txt) + "</p></section>";
    });
  }
  document.getElementById("content").innerHTML = html;

  try { localStorage.setItem("server98_state", JSON.stringify(state)); } catch (e) {}
  history.replaceState(null, "", "#" + state.lang + "-" + state.version + "-" + state.mode);
}

document.querySelectorAll("[data-key]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    setState(btn.getAttribute("data-key"), btn.getAttribute("data-val"));
  });
});

(function () {
  try {
    const saved = JSON.parse(localStorage.getItem("server98_state") || "null");
    if (saved) state = saved;
  } catch (e) {}
  const m = location.hash.replace("#", "").match(/^(ru|en)-(v1|v2|v3)-(full|short)$/);
  if (m) state = { lang: m[1], version: m[2], mode: m[3] };
  render();
})();
  </script>

<script>
(function () {
  function applyTheme(theme) {
    var next = theme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("guide-theme", next); } catch (e) {}
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    var ru = (document.documentElement.lang || "ru") === "ru";
    var label = next === "light"
      ? (ru ? "Тёмная тема" : "Dark theme")
      : (ru ? "Светлая тема" : "Light theme");
    btn.setAttribute("aria-label", label);
    btn.title = label;
  }
  var saved = null;
  try { saved = localStorage.getItem("guide-theme"); } catch (e) {}
  if (!saved && window.matchMedia) {
    saved = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  applyTheme(saved || "dark");
  var btn = document.getElementById("theme-toggle");
  if (btn) {
    btn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      applyTheme(cur === "light" ? "dark" : "light");
    });
  }
  window.__zrouteApplyTheme = applyTheme;
})();
</script>
