<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Server 98 Rules / Правила сервера 98</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>

:root {
  --bg: #0b0d10;
  --bg-2: #12161c;
  --panel: rgba(22, 27, 34, 0.92);
  --line: rgba(255, 140, 66, 0.22);
  --text: #f3ebe3;
  --muted: #a89a8d;
  --text-soft: #d2c6ba;
  --text-hint: #f0d8c2;
  --page-bg:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 100, 40, 0.18), transparent 55%),
    radial-gradient(ellipse 60% 40% at 100% 20%, rgba(80, 40, 20, 0.25), transparent 50%),
    linear-gradient(180deg, #0b0d10 0%, #10141a 40%, #0b0d10 100%);
  --hint-bg: rgba(255, 140, 66, 0.08);
  --chip-bg: rgba(0, 0, 0, 0.22);
  --surface: rgba(0, 0, 0, 0.28);
  --surface-2: rgba(0, 0, 0, 0.35);
  color-scheme: dark;
  --accent: #ff8c42;
  --accent-2: #ffb347;
  --danger: #ff5a45;
  --ok: #3dd68c;
  --glow: rgba(255, 140, 66, 0.35);
  --radius: 18px;
  --max: 920px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --changed-bg: rgba(255, 179, 71, 0.14);
  --changed-line: rgba(255, 179, 71, 0.7);
  --new-bg: rgba(61, 214, 140, 0.14);
  --new-line: rgba(61, 214, 140, 0.7);
  --font-display: "Oswald", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, sans-serif;
  --font-size-body: 19px;
}
html[data-theme="light"] {
  --bg: #f3eee7;
  --bg-2: #e8e1d7;
  --panel: rgba(255, 252, 248, 0.96);
  --line: rgba(196, 95, 26, 0.28);
  --text: #1a1410;
  --muted: #6b5e52;
  --text-soft: #4a4038;
  --text-hint: #3d342c;
  --accent: #e06a28;
  --accent-2: #c45a1a;
  --danger: #c73a2c;
  --ok: #1f9a5b;
  --glow: rgba(224, 106, 40, 0.28);
  --shadow: 0 14px 36px rgba(60, 35, 15, 0.12);
  --page-bg:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224, 106, 40, 0.14), transparent 55%),
    radial-gradient(ellipse 55% 40% at 100% 15%, rgba(180, 120, 70, 0.12), transparent 50%),
    linear-gradient(180deg, #f6f1ea 0%, #ebe4da 45%, #f6f1ea 100%);
  --hint-bg: rgba(224, 106, 40, 0.1);
  --chip-bg: rgba(255, 255, 255, 0.78);
  --surface: rgba(28, 20, 14, 0.05);
  --surface-2: rgba(28, 20, 14, 0.07);
  --changed-bg: rgba(224, 106, 40, 0.12);
  --changed-line: rgba(196, 95, 26, 0.65);
  --new-bg: rgba(31, 154, 91, 0.12);
  --new-line: rgba(31, 154, 91, 0.65);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; }
body {
  font-family: var(--font-body);
  font-size: var(--font-size-body);
  color: var(--text);
  background: var(--page-bg);
  min-height: 100vh;
  line-height: 1.55;
  padding-top: 80px !important;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,0.45), transparent 70%);
  z-index: 0;
}
.wrap {
  position: relative;
  z-index: 1;
  width: min(100% - 2rem, var(--max));
  margin: 0 auto;
}
.hero {
  margin-top: 1.25rem;
  border-radius: calc(var(--radius) + 6px);
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
  min-height: clamp(200px, 36vw, 320px);
  background: #000 center / cover no-repeat;
  display: flex;
  align-items: flex-start;
}
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(8,10,12,0.92) 0%, rgba(8,10,12,0.4) 60%, rgba(0,0,0,0.2) 100%),
    linear-gradient(90deg, rgba(8,10,12,0.55), transparent 45%);
}
.hero-lang {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  justify-content: flex-end;
}
.lang button {
  appearance: none;
  border: 1px solid rgba(255, 140, 66, 0.25);
  background: rgba(255, 255, 255, 0.03);
  color: #a89a8d;
  font: inherit;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0.4rem 0.55rem;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s ease;
}
.lang button:hover {
  color: #f3ebe3;
  border-color: rgba(255, 140, 66, 0.55);
}
.lang button.active {
  color: #1a0f08;
  background: linear-gradient(135deg, #ffb347, #ff8c42);
  border-color: transparent;
  box-shadow: 0 0 18px rgba(255, 140, 66, 0.35);
}
.hero-content {
  position: relative;
  z-index: 1;
  padding: clamp(1.25rem, 4vw, 2.25rem);
  max-width: 40rem;
}
.hero h1 {
  color: #f3ebe3;
  font-family: var(--font-display);
  text-transform: uppercase;
  font-weight: 600;
  font-size: clamp(2rem, 7vw, 3.4rem);
  line-height: 0.95;
  letter-spacing: 0.02em;
  /* Preserve former eyebrow row so the title does not jump up */
  margin-top: calc(16px * 1.55 + 0.65rem);
  margin-bottom: 0.75rem;
  text-wrap: balance;
}
.hero p {
  color: #d9cfc4;
  font-size: 1em;
  max-width: 42ch;
}
main { position: relative; z-index: 1; padding: 1.35rem 0 3.5rem; }
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem;
  margin-bottom: 0.85rem;
}
.group {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  padding: 0.35rem;
  border: 1px solid rgba(255, 140, 66, 0.22);
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.28);
}
.group button {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.03em;
  padding: 0.45rem 0.75rem;
  border-radius: 999px;
  cursor: pointer;
  transition: 0.2s ease;
}
.group button:hover {
  color: var(--text);
  border-color: rgba(255, 140, 66, 0.35);
}
.group button.active {
  color: #1a0f08;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  border-color: transparent;
  box-shadow: 0 0 18px var(--glow);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.1rem;
}
.legend span {
  font-size: 0.78rem;
  font-weight: 700;
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--muted);
}
.lg-changed {
  background: var(--changed-bg);
  border-color: var(--changed-line) !important;
  color: #ffe0a8;
}
.lg-new {
  background: var(--new-bg);
  border-color: var(--new-line) !important;
  color: #b7f5d4;
}
.info {
  background:
    linear-gradient(135deg, rgba(255, 140, 66, 0.12), rgba(255, 90, 69, 0.06)),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 0.95rem 1.1rem;
  margin-bottom: 1.1rem;
  color: var(--text-hint);
  font-size: 1em;
  box-shadow: var(--shadow);
}
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: clamp(1.1rem, 3vw, 1.6rem);
  box-shadow: var(--shadow);
  margin-bottom: 1.1rem;
}
.panel.changed {
  background: linear-gradient(0deg, var(--changed-bg), var(--changed-bg)), var(--panel);
  border-color: var(--changed-line);
}
.panel.new {
  background: linear-gradient(0deg, var(--new-bg), var(--new-bg)), var(--panel);
  border-color: var(--new-line);
}
.panel h2 {
  font-family: var(--font-display);
  text-transform: uppercase;
  font-weight: 600;
  font-size: clamp(1.35rem, 3.2vw, 1.75rem);
  letter-spacing: 0.03em;
  margin-bottom: 0.65rem;
  color: var(--accent-2);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem;
}
.panel p {
  color: var(--text-soft);
  font-size: 1em;
  margin: 0.55rem 0;
}
.badge {
  display: inline-block;
  padding: 0.22rem 0.55rem;
  border-radius: 999px;
  font-family: var(--font-body);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  vertical-align: middle;
}
.changed-badge {
  background: rgba(255, 179, 71, 0.22);
  color: #ffe0a8;
  border: 1px solid var(--changed-line);
}
.new-badge {
  background: rgba(61, 214, 140, 0.22);
  color: #b7f5d4;
  border: 1px solid var(--new-line);
}
footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid rgba(255, 140, 66, 0.12);
  padding: 1.4rem 0 2rem;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
}
.top-link {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 40;
  background: linear-gradient(135deg, var(--accent-2), var(--accent));
  color: #1a0f08;
  text-decoration: none;
  border-radius: 999px;
  padding: 0.65rem 0.95rem;
  font-weight: 800;
  box-shadow: 0 0 18px var(--glow);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(8px);
  transition: opacity 0.2s ease, visibility 0.2s ease, transform 0.2s ease, filter 0.2s ease;
}
.top-link.is-visible {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0);
}
.top-link:hover { filter: brightness(1.05); }
@media (max-width: 560px) {
  .wrap { width: min(100% - 1.25rem, var(--max)); }
  .hero-content { padding-top: 3.25rem; }
  .lang button { padding: 0.35rem 0.45rem; font-size: 0.68rem; }
  .group button { padding: 0.4rem 0.6rem; font-size: 0.72rem; }
}

.hero-controls {
  position: absolute;
  z-index: 2;
  top: clamp(1.25rem, 4vw, 2.25rem);
  right: clamp(1.25rem, 4vw, 2.25rem);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 0.45rem;
  max-width: calc(100% - 2.5rem);
}
.theme-toggle {
  appearance: none;
  width: 2.35rem;
  height: 2.35rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 140, 66, 0.35);
  background: rgba(0, 0, 0, 0.45);
  color: #ffb347;
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: 0.2s ease;
  flex-shrink: 0;
}
.theme-toggle:hover {
  border-color: rgba(255, 140, 66, 0.7);
  box-shadow: 0 0 16px var(--glow);
}
html[data-theme="light"] .theme-toggle {
  background: rgba(255, 255, 255, 0.85);
  color: #c45a1a;
  border-color: rgba(196, 95, 26, 0.35);
}
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: inline; }
html[data-theme="light"] .theme-toggle .icon-sun { display: inline; }
html[data-theme="light"] .theme-toggle .icon-moon { display: none; }
@media (max-width: 560px) {
  .hero-controls { top: 0.85rem; right: 0.85rem; }
  .hero-content { padding-top: 3.25rem; }
}
html[data-theme="light"] .chip { background: var(--chip-bg); }
html[data-theme="light"] .hint {
  background: var(--hint-bg);
  color: var(--text-hint);
  border-color: rgba(196, 95, 26, 0.35);
}
html[data-theme="light"] .shot { background: var(--surface-2); }
html[data-theme="light"] .acc { background: var(--panel); }
html[data-theme="light"] .score-row,
html[data-theme="light"] .weekday article {
  background: var(--surface);
}
html[data-theme="light"] .info {
  color: var(--text-hint);
}
html[data-theme="light"] .changed-badge,
html[data-theme="light"] .new-badge,
html[data-theme="light"] .lg-changed,
html[data-theme="light"] .lg-new {
  color: var(--text);
}
  </style>
</head>

  <div class="wrap" id="top">
